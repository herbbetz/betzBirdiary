<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/button.css">
  <link rel="stylesheet" href="/select/select.css">
  <style>
    video {
      max-width: 95%;
      height: auto;
    }
    .show {
      display: block;
    }
    .hide {
      display: none;
    }
  </style>
  <script src="/validate/birdlabels.js"></script>
</head>
<body>
<div id="validator" class="show">
  <div>
    <video width="800" height="600" controls>
      <source id="vidsrc" src="" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <hr>
  <p>
    <h3>Validation</h3>
    <form action="/validate/valid_confirm.html" method="GET">
      <div class="dropdown">
        <input type="text" class="dropdown-input" name="selectkey" placeholder="Search bird...">
        <input type="hidden" id="selectvalue" name="selectvalue">
        <!-- FIXED: Updated name attribute to "vidkey" -->
        <input type="hidden" id="videoid" name="vidkey">
        <div class="dropdown-list"></div>
      </div>

      <button type="submit">Submit</button>
    </form>
  </p>
  </div>
  <div id="novid" class="hide">No such video uploaded, probably not classified as bird by model2.</div>
  <div><a id="backlink" href="/daywatch" class="button">back</a></div>

<script>
// no XSS Defence needed when getting vidurl as get parameter from the same server
  const urlParams = new URLSearchParams(window.location.search);
  const vidkey = urlParams.get('vidkey');
  const targetUrl = vidkey ? `https://wiediversistmeingarten.org/api/uploads/videos/${vidkey}.mp4` : null;
  const vidsrc = document.getElementById('vidsrc');
  const videoidInput = document.getElementById('videoid');
  const validatorDiv = document.getElementById('validator');
  const novidDiv = document.getElementById('novid');
  document.getElementById('backlink').href = "/daywatch#" + encodeURIComponent(vidkey);

  function showNoVid() {
    validatorDiv.classList.replace('show', 'hide');
    novidDiv.classList.replace('hide', 'show');
  }

  if (targetUrl) {
    // Send a HEAD request to check availability without downloading the full video
    fetch(targetUrl, { method: 'HEAD' })
      .then(response => {
        if (response.ok) { // Status 200-299
          videoidInput.value = vidkey;
          vidsrc.src = targetUrl;
          vidsrc.parentElement.load();
        } else {
          showNoVid();
        }
      })
      .catch(() => {
        showNoVid();
      });
  } else {
    showNoVid();
  }
</script>
<script src="/select/genselect.js"></script>
</body>
</html>
