<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validate</title>
  <style>
      #loading { font-style: italic; color: #666; }
      .hidden { display: none; }
  </style>
</head>
<body>

  <div id="meta-info">Loading station details...</div>
  <div id="loading">⏳ Contacting birdiary validation API ... Please wait.</div>

  <div id="content" class="hidden">
    <h3>Validation Confirmation</h3>
    <p>Thank you for your submission. Your validation has been recorded.</p>
  </div>  
  
  <a href="/daywatch">Back</a>

  <script>
      const currentQueryParams = window.location.search;
      
      fetch(`/api/validation-data${currentQueryParams}`)
          .then(response => {
              if (!response.ok) {
                  throw new Error(`Server responded with ${response.status}`);
              }
              return response.json();
          })
          .then(data => {
              document.getElementById('loading').classList.add('hidden');
              document.getElementById('content').classList.remove('hidden');

              const metaInfo = document.getElementById('meta-info');
              metaInfo.textContent = `Validation set for ${data.video_id} in ${data.mov_id} to ${data.german_name}: ${data.latin_name}`;
              
              if (data.msg) {
                  metaInfo.appendChild(document.createElement('br'));
                  metaInfo.appendChild(document.createTextNode(data.msg));
              }
          })
          .catch(err => {
              document.getElementById('loading').textContent = "❌ Error processing validation data.";
              console.error("Fetch error:", err);
          });
  </script>
</body>
</html>
