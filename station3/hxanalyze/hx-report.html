<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HX Signal Report</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/bird.css">
    <style>
        body {
            margin: 20px;
        }
        #report {
            max-width: 1100px;
        }
        #timeline {
            width: 100%;
            height: auto;
        }
        .report-section {
            margin-top: 25px;
        }
        .report-section h2 {
            margin-bottom: 8px;
        }
        .report-table {
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        .report-table td,
        .report-table th {
            padding: 4px 12px 4px 0;
            text-align: left;
            vertical-align: top;
        }
        .report-table th {
            font-weight: bold;
        }
        .event,
        .warning,
        .reset,
        .discontinuity {
            margin: 8px 0;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #error {
            color: #b00020;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main id="report">
        <h1>HX Signal Report</h1>

        <div id="status">Analyzing signal...</div>
        <div id="error"></div>

        <div id="content" hidden>
            <p>
                <strong>Samples:</strong> <span id="samples"></span><br>
                <strong>First:</strong> <span id="first"></span><br>
                <strong>Last:</strong> <span id="last"></span>
            </p>

            <div class="report-section">
                <img id="timeline" src="" alt="HX signal timeline">
            </div>

            <div class="report-section">
                <h2>Configuration</h2>
                <table class="report-table">
                    <tbody id="configuration"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Baseline statistics</h2>
                <table class="report-table">
                    <tbody id="baseline-statistics"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Baseline maintenance</h2>
                <div id="baseline-maintenance"></div>
            </div>

            <div class="report-section">
                <h2>Oversize events</h2>
                <div id="oversize-events"></div>
            </div>

            <div class="report-section">
                <h2>Visit statistics</h2>
                <table class="report-table">
                    <tbody id="visit-statistics"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Visit durations</h2>
                <table class="report-table">
                    <tbody id="visit-durations"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Camera trigger simulation</h2>
                <table class="report-table">
                    <tbody id="camera-trigger"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Idle statistics</h2>
                <table class="report-table">
                    <tbody id="idle-statistics"></tbody>
                </table>
            </div>

            <div class="report-section">
                <h2>Warnings</h2>
                <div id="warnings"></div>
            </div>

            <div class="report-section">
                <h2>Offset discontinuities</h2>
                <div id="offset-discontinuities"></div>
            </div>

            <div class="report-section">
                <h2>Summary</h2>
                <table class="report-table">
                    <tbody id="summary"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function addRow(tbody, label, value) {
            const row = document.createElement("tr");
            const labelCell = document.createElement("th");
            const valueCell = document.createElement("td");

            labelCell.textContent = label;
            valueCell.textContent = value;

            row.appendChild(labelCell);
            row.appendChild(valueCell);
            tbody.appendChild(row);
        }

        function formatNumber(value, decimals = 2) {
            if (value === null || value === undefined) {
                return "";
            }

            if (typeof value !== "number") {
                return value;
            }

            return value.toFixed(decimals);
        }

        function renderConfiguration(data) {
            const target = document.getElementById("configuration");

            addRow(
                target,
                "weight threshold",
                `${formatNumber(data.weight_threshold)} g`
            );
            addRow(
                target,
                "threshold off",
                `${formatNumber(data.threshold_off)} g`
            );
            addRow(
                target,
                "weight limit",
                `${formatNumber(data.weightlimit, 0)} g`
            );
            addRow(target, "hxScale", data.hxScale);
            addRow(
                target,
                "startup offset",
                formatNumber(data.startup_offset, 0)
            );
            addRow(target, "startup note", data.startup_note);
            addRow(
                target,
                "CAMERA_DELAY",
                `${formatNumber(data.CAMERA_DELAY)} s`
            );
        }

        function renderBaseline(data) {
            const target = document.getElementById("baseline-statistics");

            addRow(
                target,
                "startup offset",
                formatNumber(data.startup_offset, 0)
            );

            if (data.no_idle_offset_samples) {
                addRow(
                    target,
                    "offset samples",
                    "no IDLE offset samples"
                );
                return;
            }

            addRow(
                target,
                "minimum offset",
                formatNumber(data.minimum_offset, 0)
            );
            addRow(
                target,
                "maximum offset",
                formatNumber(data.maximum_offset, 0)
            );
            addRow(
                target,
                "offset range",
                formatNumber(data.offset_range, 0)
            );
            addRow(
                target,
                "idle mean",
                formatNumber(data.idle_mean, 0)
            );
        }

        function renderBaselineMaintenance(data) {
            const target = document.getElementById(
                "baseline-maintenance"
            );

            if (!data.baseline_resets.length) {
                target.textContent = "baseline resets : none";
                return;
            }

            data.baseline_resets.forEach(reset => {
                const div = document.createElement("div");
                div.className = "reset";
                div.textContent =
                    `${reset.index}. ${reset.time} ` +
                    `offset=${formatNumber(reset.offset, 0)} ` +
                    `delta=${reset.delta >= 0 ? "+" : ""}` +
                    `${formatNumber(reset.delta, 0)}`;
                target.appendChild(div);
            });
        }

        function renderOversize(data) {
            const target = document.getElementById("oversize-events");

            if (!data.length) {
                target.textContent = "none";
                return;
            }

            data.forEach((event, index) => {
                const div = document.createElement("div");
                div.className = "event";

                const title = document.createElement("strong");
                title.textContent = `Event ${index + 1}`;

                div.appendChild(title);
                div.appendChild(document.createElement("br"));
                div.appendChild(
                    document.createTextNode(
                        `arrival : ${event.arrival}`
                    )
                );
                div.appendChild(document.createElement("br"));
                div.appendChild(
                    document.createTextNode(
                        `leave : ${event.leave ?? ""}`
                    )
                );
                div.appendChild(document.createElement("br"));
                div.appendChild(
                    document.createTextNode(
                        `peak : ${formatNumber(event.peak)} g`
                    )
                );

                target.appendChild(div);
            });
        }

        function renderVisitStatistics(data) {
            const target = document.getElementById("visit-statistics");

            addRow(target, "visits", data.visits);
            addRow(target, "camera trigger", data.camera_trigger);
            addRow(target, "oversize", data.oversize);
        }

        function renderVisitDurations(data) {
            const target = document.getElementById("visit-durations");

            if (!data.visit_durations) {
                addRow(target, "visits", "none");
                return;
            }

            addRow(
                target,
                "minimum",
                `${formatNumber(data.visit_durations.minimum)} s`
            );
            addRow(
                target,
                "maximum",
                `${formatNumber(data.visit_durations.maximum)} s`
            );
            addRow(
                target,
                "mean",
                `${formatNumber(data.visit_durations.mean)} s`
            );
        }

        function renderCameraTrigger(data) {
            const target = document.getElementById("camera-trigger");

            addRow(
                target,
                "threshold",
                `${formatNumber(
                    data.camera_trigger_threshold
                )} s`
            );
            addRow(target, "triggered", data.triggered);
        }

        function renderIdleStatistics(data) {
            const target = document.getElementById("idle-statistics");

            if (!data) {
                addRow(target, "samples", "no IDLE samples");
                return;
            }

            addRow(
                target,
                "mean weight",
                `${formatNumber(data.mean_weight)} g`
            );
            addRow(
                target,
                "minimum",
                `${formatNumber(data.minimum)} g`
            );
            addRow(
                target,
                "maximum",
                `${formatNumber(data.maximum)} g`
            );
            addRow(
                target,
                "peak-to-peak",
                `${formatNumber(data.peak_to_peak)} g`
            );
        }

        function renderWarnings(data) {
            const target = document.getElementById("warnings");

            if (!data.found) {
                target.textContent = "none";
                return;
            }

            data.items.forEach(item => {
                const div = document.createElement("div");
                div.className = "warning";

                if (item.type === "IDLE outside threshold_off") {
                    div.textContent =
                        `${item.type} started at ${item.time} ` +
                        `duration=${formatNumber(
                            item.duration,
                            1
                        )}s ` +
                        `max=${formatNumber(item.maximum)} g.`;
                } else {
                    div.textContent =
                        `${item.type}: ${item.count}`;
                }

                target.appendChild(div);
            });
        }

        function renderDiscontinuities(data) {
            const target = document.getElementById(
                "offset-discontinuities"
            );

            if (!data.length) {
                target.textContent = "none";
                return;
            }

            data.forEach(item => {
                const div = document.createElement("div");
                div.className = "discontinuity";
                div.textContent =
                    `${item.time} ` +
                    `jump=${item.jump >= 0 ? "+" : ""}` +
                    `${formatNumber(item.jump)} g ` +
                    `state=${item.state}`;
                target.appendChild(div);
            });
        }

        function renderSummary(data) {
            const target = document.getElementById("summary");

            addRow(target, "visits", data.visits);

            if (data.mean_stay !== undefined) {
                addRow(
                    target,
                    "mean stay",
                    `${formatNumber(data.mean_stay, 1)} s`
                );
                addRow(
                    target,
                    "longest",
                    `${formatNumber(data.longest, 1)} s`
                );
                addRow(
                    target,
                    "highest",
                    `${formatNumber(data.highest)} g`
                );
            }

            if (data.oversize !== undefined) {
                addRow(target, "oversize", data.oversize);
            }
        }

        async function loadReport() {
            const status = document.getElementById("status");
            const error = document.getElementById("error");
            const content = document.getElementById("content");

            try {
                const response = await fetch(
                    "/hxreport",
                    {cache: "no-store"}
                );

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(
                        data.error || `HTTP ${response.status}`
                    );
                }

                if (data.signal_csv === false) {
                    status.textContent = "no SIGNAL_CSV";
                    return;
                }

                if (data.signal_csv !== true) {
                    throw new Error("invalid /hxreport response");
                }

                document.getElementById("samples").textContent =
                    data.samples;
                document.getElementById("first").textContent =
                    data.first;
                document.getElementById("last").textContent =
                    data.last;

                document.getElementById("timeline").src =
                    data.timeline;

                renderConfiguration(data.configuration);
                renderBaseline(data.baseline_statistics);
                renderBaselineMaintenance(
                    data.baseline_statistics
                );
                renderOversize(data.oversize_events);
                renderVisitStatistics(data.visit_statistics);
                renderVisitDurations(data.visit_statistics);
                renderCameraTrigger(data.visit_statistics);
                renderIdleStatistics(data.idle_statistics);
                renderWarnings(data.warnings);
                renderDiscontinuities(
                    data.offset_discontinuities
                );
                renderSummary(data.summary);

                status.textContent = "";
                content.hidden = false;
            } catch (err) {
                status.textContent = "";
                error.textContent =
                    `Unable to load HX report: ${err.message}`;
            }
        }

        loadReport();
    </script>
</body>
</html>
