<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>HX Signal</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #111;
            color: #eee;
        }

        h1 {
            margin-top: 0;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: 400px;
            background: #181818;
            border: 1px solid #444;
        }

        #status {
            margin-top: 10px;
            color: #aaa;
        }

        #legend {
            margin-top: 10px;
        }

        .weight {
            color: #6cf;
        }

        .offset {
            color: #fc6;
        }
    </style>
</head>
<body>
    <h1>HX Signal</h1>

    <canvas id="signalCanvas"></canvas>

    <div id="legend">
        <span class="weight">■ Weight (g)</span>
        &nbsp;&nbsp;
        <span class="offset">■ Offset drift (g)</span>
    </div>

    <div id="status">Waiting for data...</div>

<script>
"use strict";

const BUFFER_SECONDS = 150;
const FETCH_INTERVAL = 1.0;
const REDRAW_INTERVAL = 0.3;
const WEIGHT_MIN = -5;
const WEIGHT_MAX = 30;

const canvas = document.getElementById("signalCanvas");
const context = canvas.getContext("2d");
const status = document.getElementById("status");

const samples = [];

let latestSample = null;
let lastFetchTime = 0;
let startOffset = null;
let hxScale = null;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;

    context.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function addSample(sample) {
    samples.push(sample);

    const cutoff = sample.t - BUFFER_SECONDS;

    while (
        samples.length > 0
        && samples[0].t < cutoff
    ) {
        samples.shift();
    }
}

async function fetchSignal() {
    try {
        const response = await fetch(
            `/hxsignal?_=${Date.now()}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (
            typeof data.t !== "number"
            || typeof data.weight !== "number"
            || typeof data.offset !== "number"
            || typeof data.hxscale !== "number"
        ) {
            throw new Error("Invalid signal data");
        }

        if (startOffset === null) {
            startOffset = data.offset;
        }

        if (hxScale === null && data.hxscale !== 0) {
            hxScale = Math.abs(data.hxscale);
        }

        const offsetGrams =
            hxScale
                ? (startOffset - data.offset) / hxScale
                : 0;

        const sample = {
            t: data.t,
            weight: data.weight,
            offset: offsetGrams
        };

        if (
            latestSample === null
            || sample.t !== latestSample.t
        ) {
            addSample(sample);
            latestSample = sample;
        }

        status.textContent =
            `Weight: ${sample.weight.toFixed(2)} g | `
            + `Offset drift: ${sample.offset.toFixed(2)} g`;

    } catch (error) {
        console.error(
            "fetch /hxsignal failed:",
            error
        );

        status.textContent =
            `Connection error: ${error.message}`;
    }
}

function drawGrid(width, height) {
    context.strokeStyle = "#333";
    context.lineWidth = 1;

    const horizontalLines = 7;

    for (let i = 0; i <= horizontalLines; i++) {
        const y = i * height / horizontalLines;

        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(width, y);
        context.stroke();
    }
}

function drawYAxis(width, height) {
    context.fillStyle = "#aaa";
    context.font = "12px sans-serif";

    const lines = 7;

    for (let i = 0; i <= lines; i++) {
        const fraction = i / lines;
        const value =
            WEIGHT_MAX
            - fraction * (WEIGHT_MAX - WEIGHT_MIN);

        const y = fraction * height;

        context.fillText(
            value.toFixed(0),
            5,
            y + 12
        );
    }
}

function drawLine(
    property,
    color,
    firstTime,
    timeRange,
    width,
    height
) {
    if (samples.length < 2) {
        return;
    }

    context.lineWidth = 2;
    context.strokeStyle = color;

    context.beginPath();

    samples.forEach((sample, index) => {
        const x =
            (sample.t - firstTime)
            / timeRange
            * width;

        const y =
            height
            - (
                (sample[property] - WEIGHT_MIN)
                / (WEIGHT_MAX - WEIGHT_MIN)
            ) * height;

        if (index === 0) {
            context.moveTo(x, y);
        } else {
            context.lineTo(x, y);
        }
    });

    context.stroke();
}

function drawSignal() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    context.clearRect(0, 0, width, height);

    if (samples.length < 2) {
        return;
    }

    const firstTime = samples[0].t;
    const lastTime = samples[samples.length - 1].t;

    const timeRange = Math.max(
        lastTime - firstTime,
        BUFFER_SECONDS
    );

    drawGrid(width, height);
    drawYAxis(width, height);

    drawLine(
        "weight",
        "#6cf",
        firstTime,
        timeRange,
        width,
        height
    );

    drawLine(
        "offset",
        "#fc6",
        firstTime,
        timeRange,
        width,
        height
    );
}

function update() {
    const now = performance.now();

    if (
        now - lastFetchTime
        >= FETCH_INTERVAL * 1000
    ) {
        lastFetchTime = now;
        fetchSignal();
    }

    drawSignal();
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();
fetchSignal();

setInterval(
    update,
    REDRAW_INTERVAL * 1000
);
</script>

</body>
</html>
